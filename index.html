<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Calculator</title>
  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
</head>
<body>
  <main class="calculator" aria-label="Calculator">
    <div class="display" role="status" aria-live="polite">
      <div class="previous" id="previous"></div>
      <div class="current" id="current">0</div>
    </div>
    <div class="keys">
      <button class="key key-clear" data-action="clear" aria-label="Clear">C</button>
      <button class="key key-action" data-action="backspace" aria-label="Backspace">&#9003;</button>
      <button class="key key-op" data-op="%" aria-label="Modulo">%</button>
      <button class="key key-op" data-op="/" aria-label="Divide">&divide;</button>

      <button class="key" data-digit="7">7</button>
      <button class="key" data-digit="8">8</button>
      <button class="key" data-digit="9">9</button>
      <button class="key key-op" data-op="*" aria-label="Multiply">&times;</button>

      <button class="key" data-digit="4">4</button>
      <button class="key" data-digit="5">5</button>
      <button class="key" data-digit="6">6</button>
      <button class="key key-op" data-op="-" aria-label="Subtract">&minus;</button>

      <button class="key" data-digit="1">1</button>
      <button class="key" data-digit="2">2</button>
      <button class="key" data-digit="3">3</button>
      <button class="key key-op" data-op="+" aria-label="Add">+</button>

      <button class="key key-op" data-action="pi" aria-label="Pi">&pi;</button>
      <button class="key" data-digit="0">0</button>
      <button class="key" data-action="decimal" aria-label="Decimal point">.</button>
      <button class="key key-equals" data-action="equals" aria-label="Equals">=</button>
    </div>
  </main>
</body>
</html>
